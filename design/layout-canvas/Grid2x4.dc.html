<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lij 2×4 grid layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&amp;display=swap">
<style>
body{margin:0}
a{color:#6B6253}a:hover{color:#3A2A08}
</style>
</helmet>
<div style="width: 1200px; height: 430px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: row; gap: 40px; background: #E6E1D5; font-family: 'Nunito', sans-serif">
<sc-for list="{{cards}}" as="card" hint-placeholder-count="4">
<div style="width: 250px; height: 350px; box-sizing: border-box; border-radius: 16px; background: #F7F4ED; border: {{card.border}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px">
<sc-for list="{{card.slots}}" as="s" hint-placeholder-count="8">
<div style="width: 58px; height: 58px; box-sizing: border-box; border-radius: 50%; background: {{s.bg}}; border: {{s.ring}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="32" height="32" role="img" aria-label="{{s.label}}"><path d="{{s.d}}" fill="none" stroke="{{s.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</sc-for>
</div>
<div style="font-size: 15px; font-weight: 800; letter-spacing: 0.12em; color: #8C8372">Lij</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ghosts":{"editor":"boolean","default":true},"omenBorder":{"editor":"boolean","default":true},"$preview":{"width":1200,"height":430}}'>
class Component extends DCLogic {
  emblems() {
    return [
      { n: 'Sun', c: '#E3A21A', ink: '#3A2A08', d: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8', b: [0, 1, 1] },
      { n: 'Moon', c: '#4F56A6', ink: '#F7F4ED', d: 'M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z', b: [0, 0, 1] },
      { n: 'Water', c: '#1E73B0', ink: '#F7F4ED', d: 'M3 8.5c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 17.5c2-2 4-2 6 0s4 2 6 0 4-2 6 0', b: [0, 0, 0] },
      { n: 'Fire', c: '#CF4520', ink: '#F7F4ED', d: 'M12 3c1 3.5 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.5 1.3-4 2.5-5.5.3 1.8 1 2.8 2 3.3 0-3 .4-5.6 1-8.3z', b: [0, 1, 0] },
      { n: 'Mountains', c: '#56636B', ink: '#F7F4ED', d: 'M2 19.5L9 7l4.2 7.2L16 10l6 9.5zM7.3 10l1.7 1.3 1.5-1.2', b: [1, 0, 1] },
      { n: 'Leaves', c: '#3A8A2E', ink: '#F7F4ED', d: 'M5 19C5 10.5 10.5 5 19.5 4.5 19.5 13.5 14 19 5 19zM5 19l8.5-8.5', b: [1, 1, 1] },
      { n: 'Rocks', c: '#86654A', ink: '#F7F4ED', d: 'M3 18.5l1.8-5.2L9 11l4 2.6-.8 4.9zM13.6 18.5l1.5-4.3 3.6-.9 2.3 2.7-.6 2.5z', b: [1, 0, 0] },
      { n: 'Sand', c: '#CDAA6C', ink: '#3A2A08', d: 'M2.5 16.5c3-3.5 6.5-3.5 9.5-1.2s6.5 2 9.5-1.3M2.5 20.5h19M7 9.5h.01M11 7h.01M15 9.5h.01M9.5 12h.01M18 6.5h.01', b: [1, 1, 0] }
    ];
  }
  renderVals() {
    const E = this.emblems();
    const ghosts = this.props.ghosts ?? true;
    const omenBorder = this.props.omenBorder ?? true;
    const order = [0, 5, 1, 4, 3, 7, 2, 6];
    const sets = [[0, 1, 2, 3], [4, 5, 6, 7], [0, 2, 5, 7], [1, 3, 4, 7]];
    const isOmen = (s) => [0, 1, 2].every((k) => s.reduce((a, i) => a ^ E[i].b[k], 0) === 0);
    const cards = sets.map((set) => ({
      border: omenBorder && isOmen(set) ? '3px solid #B8892B' : '1px solid #D6CEBD',
      slots: order.map((i) => {
        const on = set.includes(i);
        return {
          label: E[i].n,
          d: E[i].d,
          bg: on ? E[i].c : 'transparent',
          ring: on ? '2px solid transparent' : '2px dashed #D3CBBB',
          ink: on ? E[i].ink : (ghosts ? '#CFC6B4' : 'transparent')
        };
      })
    }));
    return { cards };
  }
}
</script>
</body>
</html>
